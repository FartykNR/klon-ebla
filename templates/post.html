<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Клон Eblo{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons (опционально, для иконок лайков/комментов) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Твой кастомный CSS (создадим ниже) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>{{ post.title }}</h1>

    <p>{{ post.content | safe }}</p>

    {% if post.image_path %}
    <img src="{{ url_for('uploaded_file', filename=post.image_path) }}" alt="Изображение">
    {% endif %}

    <p style="color: #666;">
        ❤️ {{ post.likes }} лайков &nbsp; 💬 {{ post.comments }} комментариев<br>
        Создано: {{ post.created_at.strftime('%d.%m.%Y %H:%M') }}
    </p>

    <div class="actions">
        <form method="POST" style="display: inline;">
            <button name="action" value="like">❤️ Лайкнуть</button>
        </form>
        <form method="POST" style="display: inline;">
            <button name="action" value="comment">💬 Комментировать (пока +1)</button>
        </form>
    </div>

    <br><br>
    <a href="/">← Назад в ленту</a>
</body>

</html>
