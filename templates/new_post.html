<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать пост — Клон Eblo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: #0d1117;
            min-height: 100vh;
        }

        .upload-area {
            border: 3px dashed #30363d;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #161b22;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #58a6ff;
            background: #1f2937;
        }

        .preview-box {
            max-height: 500px;
            overflow: hidden;
            border-radius: 12px;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .preview-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .form-section {
            background: #161b22;
            border-radius: 12px;
            padding: 2rem;
        }

        .btn-publish {
            background: linear-gradient(135deg, #58a6ff, #007bff);
            border: none;
        }

        .spinner {
            display: none;
        }

        .file-input {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <h1 class="text-center mb-5 text-white">Создать пост</h1>

        <div class="row g-5">
            <!-- Левая часть: форма -->
            <div class="col-lg-7">
                <div class="form-section shadow">
                    <form id="postForm" method="POST" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label for="title" class="form-label fs-5 fw-bold">Заголовок</label>
                            <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary"
                                id="title" name="title" placeholder="Придумай крутое название..." required autofocus
                                maxlength="100">
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label fs-5 fw-bold">Описание / текст</label>
                            <textarea class="form-control form-control-lg bg-dark text-white border-secondary"
                                id="content" name="content" rows="8"
                                placeholder="Расскажи подробнее... Можно эмодзи, ссылки, что угодно"
                                required></textarea>
                        </div>

                        <!-- Кнопки внизу -->
                        <div class="d-flex gap-3 mt-5">
                            <button type="submit" id="submitBtn" class="btn btn-publish btn-lg flex-grow-1 fw-bold">
                                <span class="spinner-border spinner-border-sm spinner me-2" role="status"></span>
                                Опубликовать
                            </button>
                            <a href="/" class="btn btn-outline-secondary btn-lg">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Правая часть: зона загрузки и предпросмотр (как в YouTube Studio) -->
            <div class="col-lg-5">
                <div id="dropZone" class="upload-area mb-4">
                    <i class="bi bi-cloud-arrow-up fs-1 mb-3 text-muted"></i>
                    <h5>Перетащи картинку сюда или кликни</h5>
                    <p class="text-muted small mb-0">jpg, png, gif, webp • до 10 МБ</p>

                    <!-- Явное поле ввода + лейбл для него -->
                    <label for="image" class="btn btn-outline-primary mt-3">
                        <i class="bi bi-images me-2"></i>Выбрать файл
                    </label>
                    <input type="file" id="image" name="image" class="file-input" accept="image/*">
                </div>

                <div id="previewBox" class="preview-box d-none">
                    <img id="previewImg" class="preview-img" alt="Предпросмотр">
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script>
                const dropZone = document.getElementById('dropZone');
                const fileInput = document.getElementById('image');
                const previewBox = document.getElementById('previewBox');
                const previewImg = document.getElementById('previewImg');
                const submitBtn = document.getElementById('submitBtn');
                const spinner = submitBtn.querySelector('.spinner');

                // Клик по зоне → открывает выбор файла
                dropZone.addEventListener('click', () => fileInput.click());

                // Drag & Drop
                ['dragenter', 'dragover'].forEach(event => {
                    dropZone.addEventListener(event, e => {
                        e.preventDefault();
                        dropZone.classList.add('dragover');
                    });
                });

                ['dragleave', 'drop'].forEach(event => {
                    dropZone.addEventListener(event, e => {
                        e.preventDefault();
                        dropZone.classList.remove('dragover');
                    });
                });

                dropZone.addEventListener('drop', e => {
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        handleFile(file);
                    }
                });

                // При выборе файла
                fileInput.addEventListener('change', e => {
                    const file = e.target.files[0];
                    if (file) handleFile(file);
                });

                function handleFile(file) {
                    if (file.size > 10 * 1024 * 1024) {
                        alert('Файл слишком большой! Максимум 10 МБ.');
                        fileInput.value = '';
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = e => {
                        previewImg.src = e.target.result;
                        previewBox.classList.remove('d-none');
                    };
                    reader.readAsDataURL(file);
                }

                // Лоадер при отправке
                document.getElementById('postForm').addEventListener('submit', () => {
                    submitBtn.disabled = true;
                    spinner.style.display = 'inline-block';
                });
            </script>
</body>

</html>
