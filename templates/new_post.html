<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать пост — Клон Eblo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background: #0d1117;
            min-height: 100vh;
        }

        .upload-area {
            border: 3px dashed #30363d;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #161b22;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #58a6ff;
            background: #1f2937;
        }

        .preview-box {
            max-height: 500px;
            overflow: hidden;
            border-radius: 12px;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .preview-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .form-section {
            background: #161b22;
            border-radius: 12px;
            padding: 2rem;
        }

        .btn-publish {
            background: linear-gradient(135deg, #58a6ff, #007bff);
            border: none;
        }

        .spinner {
            display: none;
        }

        .file-input {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <h1 class="text-center mb-5 text-white">Создать пост</h1>

        <form id="postForm" method="POST" enctype="multipart/form-data"></form>
        <div class="row g-5">
            <!-- Левая часть: форма -->
            <div class="col-lg-7">
                <div class="form-section shadow">
                    <div class="mb-4">
                        <label for="title" class="form-label fs-5 fw-bold">Заголовок</label>
                        <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary"
                            id="title" name="title" placeholder="Придумай крутое название..." required autofocus
                            maxlength="100">
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fs-5 fw-bold">Описание / текст</label>
                        <textarea class="form-control form-control-lg bg-dark text-white border-secondary" id="content"
                            name="content" rows="8" placeholder="Расскажи подробнее... Можно эмодзи, ссылки, что угодно"
                            required></textarea>
                    </div>

                    <!-- Кнопки внизу -->
                    <div class="d-flex gap-3 mt-5">
                        <button type="submit" id="submitBtn" class="btn btn-publish btn-lg flex-grow-1 fw-bold">
                            <span class="spinner-border spinner-border-sm spinner me-2" role="status"></span>
                            Опубликовать
                        </button>
                        <a href="/" class="btn btn-outline-secondary btn-lg">Отмена</a>
                    </div>
                </div>
            </div>

            <!-- Правая часть: зона загрузки и предпросмотр (как в YouTube Studio) -->
            <div class="col-lg-5">
                <div class="form-section shadow p-4">
                    <label for="image" class="form-label fs-5 fw-bold">Картинка (опционально)</label>
                    <input type="file" class="form-control form-control-lg bg-dark text-white border-secondary"
                        id="image" name="image" accept="image/*">
                    id="image" name="image" accept="image/*" form="postForm">
                    <small class="text-muted">jpg, png, gif, webp • до 10 МБ</small>
                </div>
            </div>
            </form>
</body>

</html>
