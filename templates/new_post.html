<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Клон Eblo{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons (опционально, для иконок лайков/комментов) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Твой кастомный CSS (создадим ниже) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Создать новый пост</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Заголовок" required>
        <textarea name="content" rows="6" placeholder="Что хочешь показать? (текст)" required></textarea>
        <input type="file" name="image" accept="image/*">
        <br><br>
        <button type="submit">Опубликовать</button>
    </form>
    <br>
    <a href="/">← Назад в ленту</a>
</body>

</html>
